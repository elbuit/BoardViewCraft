[workspace]
resolver = "3"
members = [
    "crates/*",
    "apps/*",
]
default-members = ["apps/boardviewcraft"]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
bvc-core = { path = "crates/bvc-core" }
bvc-ui-egui = { path = "crates/ui-egui" }
egui = { version = "0.37", features = ["serde", "monochrome_emoji_fonts"] }
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "wgpu", "wayland", "x11"] }
lyon_tessellation = "1.0.22"
thiserror = "2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3.7"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
pdfcraft-render = { git = "https://github.com/storytold/pdfcraft", rev = "a1ea2d37", version = "0.18.1" }

[patch.crates-io]
hayro-interpret = { git = "https://github.com/storytold/pdfcraft", rev = "a1ea2d37" }
hayro = { git = "https://github.com/storytold/pdfcraft", rev = "a1ea2d37" }
hayro-syntax = { git = "https://github.com/storytold/pdfcraft", rev = "a1ea2d37" }
hayro-cmap = { git = "https://github.com/storytold/pdfcraft", rev = "a1ea2d37" }
hayro-postscript = { git = "https://github.com/storytold/pdfcraft", rev = "a1ea2d37" }
hayro-jbig2 = { git = "https://github.com/storytold/pdfcraft", rev = "a1ea2d37" }
lopdf = { git = "https://github.com/storytold/pdfcraft", rev = "a1ea2d37" }
vello_common = { git = "https://github.com/storytold/pdfcraft", rev = "a1ea2d37" }
vello_cpu = { git = "https://github.com/storytold/pdfcraft", rev = "a1ea2d37" }

# Build profiles adopted from pdfcraft: dependencies (PDF engine, tessellation) are optimised even in
# dev builds so `cargo run` stays usable; release uses thin LTO and one codegen unit.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
resolver = "3"
members = [
    "crates/bvc-core",
    "crates/bvc-app",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
bvc-core = { path = "crates/bvc-core" }
egui = { version = "0.36", features = ["serde"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
lyon_tessellation = "1.0.22"
thiserror = "2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }

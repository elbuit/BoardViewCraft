[workspace]
resolver = "3"
members = [
    "crates/*",
    "apps/*",
]
default-members = ["apps/boardviewcraft"]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
bvc-core = { path = "crates/bvc-core" }
bvc-ui-egui = { path = "crates/ui-egui" }
egui = { version = "0.37", features = ["serde"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
lyon_tessellation = "1.0.22"
thiserror = "2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
pdfcraft-render = { git = "https://github.com/storytold/pdfcraft", rev = "fa5f9f8c", version = "0.15.0" }

[patch.crates-io]
hayro-interpret = { git = "https://github.com/storytold/pdfcraft", rev = "fa5f9f8c" }
hayro = { git = "https://github.com/storytold/pdfcraft", rev = "fa5f9f8c" }
hayro-syntax = { git = "https://github.com/storytold/pdfcraft", rev = "fa5f9f8c" }
hayro-cmap = { git = "https://github.com/storytold/pdfcraft", rev = "fa5f9f8c" }
hayro-postscript = { git = "https://github.com/storytold/pdfcraft", rev = "fa5f9f8c" }
hayro-jbig2 = { git = "https://github.com/storytold/pdfcraft", rev = "fa5f9f8c" }
lopdf = { git = "https://github.com/storytold/pdfcraft", rev = "fa5f9f8c" }
vello_common = { git = "https://github.com/storytold/pdfcraft", rev = "fa5f9f8c" }
vello_cpu = { git = "https://github.com/storytold/pdfcraft", rev = "fa5f9f8c" }

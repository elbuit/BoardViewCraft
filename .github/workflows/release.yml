name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 0.2.0)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------------------------------------------
  # Linux release (x86_64, aarch64, riscv64)
  # -----------------------------------------------------------------------------------------------
  build-linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            formats: "appimage deb rpm tar"
            use_cross: false
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            formats: "appimage deb rpm tar"
            use_cross: true
          - arch: riscv64
            target: riscv64gc-unknown-linux-gnu
            formats: "deb rpm tar"
            use_cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (x86_64 host)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Install nfpm
        run: |
          echo "Installing nfpm for deb and rpm packaging..."
          curl -sSL --retry 5 --retry-delay 2 -o /tmp/nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v2.41.3/nfpm_2.41.3_Linux_x86_64.tar.gz"
          sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
          rm -f /tmp/nfpm.tar.gz

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Package Linux (${{ matrix.arch }})
        env:
          CROSS_ARCH: ${{ matrix.arch }}
          CROSS_TARGET: ${{ matrix.target }}
        run: |
          chmod +x packaging/linux/package.sh
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --package boardviewcraft --target ${{ matrix.target }} --ignore-rust-version
            packaging/linux/package.sh --skip-build --formats "${{ matrix.formats }}"
          else
            packaging/linux/package.sh --formats "${{ matrix.formats }}"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*

  # -----------------------------------------------------------------------------------------------
  # Windows release (x64, arm64)
  # -----------------------------------------------------------------------------------------------
  build-windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Package Windows (${{ matrix.arch }})
        shell: pwsh
        run: |
          packaging/windows/package.ps1 -Arch ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*

  # -----------------------------------------------------------------------------------------------
  # macOS release (arm64, x86_64)
  # -----------------------------------------------------------------------------------------------
  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            targets: aarch64-apple-darwin
          - arch: x86_64
            targets: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Package macOS (${{ matrix.arch }})
        run: |
          chmod +x packaging/macos/package.sh
          packaging/macos/package.sh --arch ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/release/*

  # -----------------------------------------------------------------------------------------------
  # Publish GitHub Release
  # -----------------------------------------------------------------------------------------------
  publish-release:
    name: Publish Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten artifacts into dist
        run: |
          mkdir -p dist
          find release-artifacts/ -type f -exec mv {} dist/ \;
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true

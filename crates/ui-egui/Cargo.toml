[package]
name = "bvc-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bvc-core = { workspace = true }
egui = { workspace = true, features = ["bytemuck"] }
eframe = { workspace = true }
lyon_tessellation = { workspace = true }
rayon = { workspace = true }
rfd = { workspace = true }
arboard = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
flate2 = { workspace = true }
pdfcraft-render = { workspace = true }
bytemuck = { version = "1", features = ["extern_crate_alloc"] }

[target.'cfg(windows)'.dependencies]
# Auto interface language: the Windows display language, without starting a process.
sys-locale = "0.3"

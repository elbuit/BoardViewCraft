# Flatpak manifest for the single-file bundle attached to every GitHub release
# (boardviewcraft-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.

id: io.github.elbuit.BoardViewCraft
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: boardviewcraft
finish-args:
  # Display: Wayland first; X11 fallback
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM)
  - --share=ipc
  # GPU access for wgpu
  - --device=dri
  # File access via portals or common dirs
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-pictures
modules:
  - name: poppler-tools
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_UNSTABLE_API_ABI_HEADERS=OFF
      - -DBUILD_CPP_TESTS=OFF
      - -DENABLE_GLIB=OFF
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
      - -DENABLE_LIBOPENJPEG=none
      - -DENABLE_CMS=none
      - -DENABLE_BOOST=OFF
      - -DENABLE_UTILS=ON
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-24.08.0.tar.xz
        sha256: e4e2944b204646736274e1d09e51cce677ec21ab17019abf5589c3bc8880a424

  - name: boardviewcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/boardviewcraft /app/bin/boardviewcraft
      - install -Dm644 share/applications/io.github.elbuit.BoardViewCraft.desktop /app/share/applications/io.github.elbuit.BoardViewCraft.desktop
      - install -Dm644 share/metainfo/io.github.elbuit.BoardViewCraft.metainfo.xml /app/share/metainfo/io.github.elbuit.BoardViewCraft.metainfo.xml
      - mkdir -p /app/share/icons && cp -R share/icons/hicolor /app/share/icons/
    sources:
      - type: dir
        path: stage
